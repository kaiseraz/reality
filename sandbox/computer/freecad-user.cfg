<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!-- Reality: import STEP assemblies as a part tree instead of one merged compound
     (Mod/Import/ReadShapeCompoundMode=0). Copied into new desktops' homes. -->
<FCParameters>

  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="LogLevels">
        <FCInt Name="Default" Value="2"/>
      </FCParamGroup>
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="General"/>
        <FCParamGroup Name="Units"/>
        <FCParamGroup Name="Macro"/>
        <FCParamGroup Name="Mod">
          <FCParamGroup Name="Import">
            <FCParamGroup Name="hSTEP">
              <FCBool Name="ReadShapeCompoundMode" Value="1"/>
            </FCParamGroup>
            <FCBool Name="ReadShapeCompoundMode" Value="0"/>
            <FCBool Name="UseLinkGroup" Value="0"/>
          </FCParamGroup>
          <FCParamGroup Name="OpenSCAD"/>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>

</FCParameters>
