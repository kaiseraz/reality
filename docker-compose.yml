services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reality
      POSTGRES_PASSWORD: reality # local dev only
      POSTGRES_DB: reality
    ports:
      - '127.0.0.1:5432:5432'
    # Named volume, not a bind mount: keeps database files out of the OneDrive-synced folder.
    volumes:
      - reality-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reality -d reality']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reality-pg:
